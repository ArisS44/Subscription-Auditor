services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/app:/app/app # hot reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    env_file:
      - path: ./frontend/.env.local
        required: false
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0
